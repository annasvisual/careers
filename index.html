<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>London bank jobs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#151515;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:684px;margin:auto;padding:48px 32px}h1{font-size:32px;line-height:1.1;font-weight:850;letter-spacing:-1.6px;margin:0 0 8px}.meta{font-size:14px;font-weight:600;margin:0;color:#40403d}header{border-bottom:4px solid #151515;padding-bottom:28px}section{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:28px 0;border-bottom:2px solid #c9c7be}h2{font-size:20px;font-weight:800;letter-spacing:-.6px;margin:0;font-variant-numeric:tabular-nums}ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}a{color:inherit;font-size:18px;font-weight:750;letter-spacing:-.35px;text-decoration:none;overflow-wrap:anywhere}a:hover{text-decoration:underline}p{margin:0}.empty{color:#484842;font-weight:600}.warning{color:#8a360c;font-size:14px;font-weight:600;margin-top:12px}.notice{padding:28px 0}footer{margin-top:25px;color:#56564f;font-size:12px}small{font-size:12px}@media(max-width:440px){main{padding:28px 18px}section{grid-template-columns:1fr;gap:10px}}
</style>
</head>
<body><main><header><h1>London bank jobs</h1><p class="meta">Marketing · Junior product · Early careers finance</p></header><div id="feed" aria-live="polite"><p class="notice">Loading vacancies…</p></div><footer id="updated"></footer></main>
<script>
const feed=document.getElementById('feed');
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n};
const dateLabel=s=>{const [y,m,d]=s.split('-');return `${d}.${m}`};
const dayBefore=(a,b)=>{const d=new Date(a+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)===b};
function emptyDay(d){return !d.jobs.length&&!Object.keys(d.errors||{}).length&&!(d.baseline_sources||[]).length}
function render(data){
 feed.replaceChildren();
 const days=[...data.days].sort((a,b)=>b.date.localeCompare(a.date));
 if(!days.length){feed.append(el('p','Tracking starts after the first scheduled check.','notice'));return}
 let previousYear=null;
 for(let i=0;i<days.length;i++){
  const d=days[i];let end=d.date;
  if(emptyDay(d))while(i+1<days.length&&emptyDay(days[i+1])&&dayBefore(days[i].date,days[i+1].date)&&days[i+1].date.slice(0,4)===d.date.slice(0,4))end=days[++i].date;
  const section=el('section');const label=end===d.date?dateLabel(d.date):`${dateLabel(end)}–${dateLabel(d.date)}`;
  const date=el('div');date.append(el('h2',label));
  if(previousYear!==d.date.slice(0,4)){date.append(el('small',d.date.slice(0,4)));previousYear=d.date.slice(0,4)}
  section.append(date);const content=el('div');
  if(d.jobs.length){const list=el('ul');for(const j of d.jobs){let url;try{url=new URL(j.url)}catch{continue}if(url.protocol!=='https:')continue;const item=el('li'),a=el('a',`${j.source} — ${j.title} ↗`);a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';item.append(a);list.append(item)}content.append(list)}
  const failed=Object.keys(d.errors||{});
  if(!d.jobs.length&&!failed.length&&!(d.baseline_sources||[]).length)content.append(el('p','No new vacancies','empty'));
  if((d.baseline_sources||[]).length)content.append(el('p',`Initial check: ${d.baseline_sources.join(', ')}. Existing vacancies saved; new openings will appear from the next check.`, 'meta'));
  if(failed.length)content.append(el('p',`Check incomplete: ${failed.join(', ')}.`, 'warning'));
  section.append(content);feed.append(section);
 }
 if(data.last_checked)document.getElementById('updated').textContent='Last checked: '+new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'}).format(new Date(data.last_checked))+' · London time';
}
fetch('./data/jobs.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(render).catch(()=>feed.replaceChildren(el('p','Unable to load vacancies. Please try again later.','warning')));
</script></body></html>
